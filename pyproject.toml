[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physiomotion-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=0.10",
    "opencv-python>=4.8",
    "customtkinter>=5.2",
    "anthropic>=0.25",
    "pyttsx3>=2.90",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-mock>=3.11"]

[project.scripts]
physio = "physio_app.main:main"
client = "client_app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["core", "physio_app", "client_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
